<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.45" stop-color="#171127"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="commandBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0569a9"/>
      <stop offset="0.52" stop-color="#0b8ed0"/>
      <stop offset="1" stop-color="#045b92"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c474f"/>
      <stop offset="1" stop-color="#11171c"/>
    </linearGradient>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #f4f8fb; }
      .hint { font-size: 17px; fill: #b5c6d3; }
      .small { font-size: 18px; fill: #e9f3fa; }
      .medium { font-size: 22px; font-weight: 800; }
      .title { font-size: 27px; font-weight: 900; }
      .cardTitle { font-size: 17px; font-weight: 800; fill: #f7fbff; }
      .cardSub { font-size: 13px; fill: #c3d1db; }
    </style>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>
  <ellipse cx="716" cy="389" rx="510" ry="232" fill="#27164a" opacity="0.46"/>
  <ellipse cx="716" cy="389" rx="404" ry="178" fill="none" stroke="#7256bb" stroke-width="4" opacity="0.36"/>
  <rect x="0" y="0" width="1440" height="810" fill="#000" opacity="0.42"/>

  <g filter="url(#floatShadow)">
    <rect x="112" y="78" width="966" height="258" rx="14" fill="#071018" opacity="0.74" stroke="#26445a" stroke-width="1.5"/>
    <text x="135" y="112" class="label medium">牌库</text>
    <text x="205" y="112" class="label hint">拖动浏览；已选卡保留在牌库中并同步到下方槽位</text>
    <path d="M1046,194 l26,30 l-26,30" fill="none" stroke="#eaf7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>

    <g transform="translate(136 136)">
      <rect x="0" y="0" width="126" height="176" rx="10" fill="#0a5d75" stroke="#58e0ff" stroke-width="3"/>
      <rect x="12" y="14" width="102" height="70" rx="6" fill="#3fd7bf" opacity="0.65"/>
      <text x="14" y="116" class="label cardTitle">玛俐的莫鲁贝可</text>
      <text x="14" y="144" class="label cardSub">可选择</text>
    </g>

    <g transform="translate(286 136)">
      <rect x="-6" y="-6" width="138" height="188" rx="14" fill="#f0d25b" opacity="0.24"/>
      <rect x="0" y="0" width="126" height="176" rx="10" fill="#72204f" stroke="#ffe477" stroke-width="5"/>
      <rect x="12" y="14" width="102" height="70" rx="6" fill="#e96cae" opacity="0.65"/>
      <circle cx="104" cy="23" r="17" fill="#f4d751" stroke="#1e2730" stroke-width="2"/>
      <path d="M96 23 l6 7 l12 -14" fill="none" stroke="#1e2730" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="14" y="116" class="label cardTitle">小仙奶</text>
      <text x="14" y="144" class="label cardSub">已选 1/2</text>
    </g>

    <g transform="translate(436 136)" opacity="0.62">
      <rect x="0" y="0" width="126" height="176" rx="10" fill="#35414b" stroke="#607383" stroke-width="2"/>
      <rect x="12" y="14" width="102" height="70" rx="6" fill="#788792" opacity="0.35"/>
      <circle cx="104" cy="23" r="15" fill="#1b2229" stroke="#a7b8c5" stroke-width="2"/>
      <text x="99" y="29" class="label small">i</text>
      <text x="14" y="116" class="label cardTitle">高级球</text>
      <text x="14" y="144" class="label cardSub">可查看，不可选</text>
    </g>

    <g transform="translate(586 136)">
      <rect x="0" y="0" width="126" height="176" rx="10" fill="#305285" stroke="#58e0ff" stroke-width="3"/>
      <rect x="12" y="14" width="102" height="70" rx="6" fill="#75a2ff" opacity="0.65"/>
      <text x="14" y="116" class="label cardTitle">水能量</text>
      <text x="14" y="144" class="label cardSub">可选择</text>
    </g>

    <g transform="translate(736 136)">
      <rect x="0" y="0" width="126" height="176" rx="10" fill="#87531a" stroke="#58e0ff" stroke-width="3"/>
      <rect x="12" y="14" width="102" height="70" rx="6" fill="#ffb25b" opacity="0.62"/>
      <text x="14" y="116" class="label cardTitle">斗能量</text>
      <text x="14" y="144" class="label cardSub">可选择</text>
    </g>

    <g transform="translate(886 136)">
      <rect x="0" y="0" width="126" height="176" rx="10" fill="#1c5d3a" stroke="#58e0ff" stroke-width="3"/>
      <rect x="12" y="14" width="102" height="70" rx="6" fill="#7ad681" opacity="0.65"/>
      <text x="14" y="116" class="label cardTitle">草能量</text>
      <text x="14" y="144" class="label cardSub">可选择</text>
    </g>
  </g>

  <g filter="url(#floatShadow)">
    <rect x="1110" y="92" width="206" height="288" rx="15" fill="#0b1118" opacity="0.92" stroke="#66809a" stroke-width="2"/>
    <text x="1134" y="128" class="label small">当前使用</text>
    <rect x="1150" y="150" width="126" height="176" rx="10" fill="#e8edf1" stroke="#bec8cf" stroke-width="3"/>
    <rect x="1163" y="174" width="100" height="70" rx="6" fill="#7e9ed2"/>
    <text x="1165" y="278" class="label cardTitle" fill="#1d2830">巢穴球</text>
    <text x="1165" y="303" class="label cardSub" fill="#435564">道具</text>
    <text x="1134" y="354" class="label hint">右侧只读；可查看详情</text>
  </g>

  <g filter="url(#floatShadow)">
    <path d="M96,374 L1342,374 L1320,446 L118,446 Z" fill="url(#commandBar)" stroke="#d2b13e" stroke-width="4"/>
    <text x="150" y="408" class="label title">选择 1 张符合条件的卡加入手牌</text>
    <text x="150" y="431" class="label hint" fill="#dcecf5">已选 1/1；点击下方已选卡可移除</text>
    <rect x="925" y="389" width="150" height="48" rx="5" fill="#f0d25b" stroke="#8b711f" stroke-width="2"/>
    <text x="978" y="421" class="label small" fill="#1d2630" font-weight="900">确认</text>
    <rect x="1094" y="389" width="150" height="48" rx="5" fill="#d9e5ee" stroke="#7a8792" stroke-width="2"/>
    <text x="1147" y="421" class="label small" fill="#27323a" font-weight="900">取消</text>
  </g>

  <g filter="url(#floatShadow)">
    <rect x="338" y="514" width="764" height="194" rx="14" fill="#071018" opacity="0.76" stroke="#26445a" stroke-width="1.5"/>
    <text x="365" y="551" class="label medium">已选 1/1</text>
    <text x="478" y="551" class="label hint">确认前不会结算；再次点击可取消选择</text>
    <g transform="translate(568 574)">
      <rect x="-6" y="-6" width="124" height="170" rx="13" fill="#f0d25b" opacity="0.24"/>
      <rect x="0" y="0" width="112" height="158" rx="9" fill="#72204f" stroke="#ffe477" stroke-width="5"/>
      <rect x="11" y="13" width="90" height="61" rx="5" fill="#e96cae" opacity="0.65"/>
      <circle cx="92" cy="22" r="15" fill="#f4d751" stroke="#1e2730" stroke-width="2"/>
      <path d="M84 22 l6 7 l12 -14" fill="none" stroke="#1e2730" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="106" class="label cardTitle">小仙奶</text>
      <text x="12" y="132" class="label cardSub">点此移除</text>
    </g>
    <g transform="translate(722 574)">
      <rect x="0" y="0" width="112" height="158" rx="9" fill="url(#slot)" stroke="#6a7b87" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="22" y="83" class="label hint">空槽</text>
      <text x="15" y="112" class="label cardSub">需要时显示</text>
    </g>
  </g>
</svg>
